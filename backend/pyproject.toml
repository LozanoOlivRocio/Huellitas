[project]
name = "backend"
version = "0.1.0"
description = "API de Huellitas con persistencia en SQL Server"
readme = "README.md"
authors = [
    { name = "GinoTaipe", email = "gino_gjtm@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
    "pillow>=11,<13",
    "pyodbc>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "httpx2>=2.16.2",
]

[project.scripts]
backend = "backend:main"
huellitas-db = "backend.repositories.migrations:main"
huellitas-sqlserver = "backend.repositories.sqlserver_setup:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
